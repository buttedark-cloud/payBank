name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Проверяем код репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Устанавливаем зависимости бэкенда
      run: |
        cd server
        npm install

    - name: Проверяем сборку проекта
      run: |
        cd server
        npm run build --if-present
